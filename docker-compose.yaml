services:
  redis:
    image: redis:7.4-alpine
    container_name: redis
    restart: always
    networks:
    - mynetwork
    ports:
    - 6378:6379
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
  postgres:
    image: postgres:17-alpine
    container_name: postgres
    restart: always
    networks:
      - mynetwork
    environment:
      - POSTGRES_USER=shopflow
      - POSTGRES_PASSWORD=shopflow
      - POSTGRES_DB=shopflow
    ports:
      - 5433:5432
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  backend: 
    image: gerald22/shopflow_be:1.1
    container_name: backend
    restart: always
    networks:
      - mynetwork
    ports:
      - 5000:5000
    env_file:
      - ./application/backend/config.env
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy
  
  frontend:
    image: gerald22/shopflow_fe:1.0
    container_name: frontend
    restart: always
    networks:
      - mynetwork
    ports:
      - 8089:80

networks:
  mynetwork:
    