name: ci

on:
    push:
        branches: [ main ]
    pull_request:
        branches: [ main ]

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

env: 
    IMAGE_NAME: gerald22/shopflow_be
    DOCKERHUB_USERNAME: gerald22
    ECR_REPOSITORY: shopflow-helix-capstone

jobs: 
    lint-test:
        runs-on: ubuntu-latest
        steps:
            - name: checkout source
              uses: actions/checkout@v4

            - name: Set up python
              uses: actions/setup-python@v5
              with:
                python-version: "3.11"
                cache: "pip"
                cache-dependency-path: application/backend/requirements.txt

            - name: Install dependencies
              working-directory: ./application/backend
              run: |
                python -m pip install --upgrade pip
                pip install -r requirements.txt
            
            - name: Lint 
              working-directory: ./application/backend
              run: |
                pip install flake8
                flake8 .

            - name: Test
              working-directory: ./application/backend
              run: |
                    pip install pytest
                    pytest

    security-scan:
        runs-on: ubuntu-latest
        steps:
            - name: checkout source
              uses: actions/checkout@v4

            - name: Trivy File System Scan 
              uses: aquasecurity/trivy-action@0.35.0
              with:
                scan-type: fs
                scan-ref: .
                scanners: vuln,secret,misconfig
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'
    
    docker:
        runs-on: ubuntu-latest
        needs: [lint-test, security-scan] 
        steps: 

            - name: checkout source
              uses: actions/checkout@v4

            - name: Lint Dockerfile
              uses: hadolint/hadolint-action@v3.1.0
              with:
                dockerfile: ./application/backend/Dockerfile
                failure-threshold: warning

            - name: Setting up buildx
              uses: docker/setup-buildx-action@v3
            
            - name: Build image
              uses: docker/build-push-action@v6
              with:
                context: ./application/backend
                file: ./application/backend/Dockerfile
                push: false
                load: true
                tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
                cache-from: type=gha
                cache-to: type=gha,mode=max

            - name: Trivy Image Scan
              uses: aquasecurity/trivy-action@0.35.0
              with:
                image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
                severity: HIGH,CRITICAL
                ignore-unfixed: true
                exit-code: '1'

            - name: Login to Docker Hub
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/login-action@v3
              with:
                username: ${{ env.DOCKERHUB_USERNAME }}
                password: ${{ secrets.DOCKERHUB_TOKEN }}

            - name: Configure AWS credentials (OIDC)
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: aws-actions/configure-aws-credentials@v4
              with:
                aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
                aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
                aws-region: ${{ vars.AWS_REGION }}

            - name: Login to Amazon ECR
              id: ecr
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: aws-actions/amazon-ecr-login@v2

            - name: Push image to Docker Hub and ECR
              if: github.event_name == 'push' && github.ref == 'refs/heads/main'
              uses: docker/build-push-action@v6
              with:
                context: ./application/backend
                file: ./application/backend/Dockerfile
                push: true
                tags: |
                    ${{ env.IMAGE_NAME }}:${{ github.sha }}
                    ${{ env.IMAGE_NAME }}:latest
                    ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}
                    ${{ steps.ecr.outputs.registry }}/${{ env.ECR_REPOSITORY }}:latest
                cache-from: type=gha