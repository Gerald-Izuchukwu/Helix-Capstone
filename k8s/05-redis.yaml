apiVersion: apps/v1
kind: Deployment
metadata:
  name: redis
  namespace: shopflow
  labels:
    app: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: redis
  template:
    metadata:
      labels:
        app: redis
    spec:
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: redis
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop: [ "ALL" ]
        image: redis:7.4-alpine
        ports:
        - containerPort: 6379
        readinessProbe:
          exec:
            command: [ "redis-cli", "ping" ]
          initialDelaySeconds: 3
          periodSeconds: 5
        livenessProbe:
          exec:
            command: [ "redis-cli", "ping" ]
          initialDelaySeconds: 10
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 200m
            memory: 128Mi
        volumeMounts:
        - name: redis-data
          mountPath: /data
      volumes:
      - name: redis-data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: redis
  namespace: shopflow
spec:
  selector:
    app: redis
  ports:
  - port: 6379
    targetPort: 6379
