apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: default-deny-ingress, namespace: shopflow }
spec:
  podSelector: {}
  policyTypes: [ "Ingress" ]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-frontend, namespace: shopflow }
spec:
  podSelector: { matchLabels: { app: frontend } }
  policyTypes: [ "Ingress" ]
  ingress:
  - {}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-backend, namespace: shopflow }
spec:
  podSelector: { matchLabels: { app: backend } }
  policyTypes: [ "Ingress" ]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: frontend } }
    - namespaceSelector:
        matchLabels: { kubernetes.io/metadata.name: monitoring }
    ports:
    - { port: 5000 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-postgres, namespace: shopflow }
spec:
  podSelector: { matchLabels: { app: postgres } }
  policyTypes: [ "Ingress" ]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: backend } }
    ports:
    - { port: 5432 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: allow-redis, namespace: shopflow }
spec:
  podSelector: { matchLabels: { app: redis } }
  policyTypes: [ "Ingress" ]
  ingress:
  - from:
    - podSelector: { matchLabels: { app: backend } }
    ports:
    - { port: 6379 }
